{{template "head" .}}
{{template "nav" .}}
<main>
  {{template "flash" .}}

  <div class="page-head">
    <h1>{{.T.TitlePassword}}</h1>
    <p class="lede">{{.T.PasswordIntro}}</p>
  </div>

  <section class="card">
    <form id="password-form">
      <div class="grid">
        <div>
          <label for="current-password">{{.T.PasswordCurrent}}</label>
          <input id="current-password" name="current_password" type="password"
                 autocomplete="current-password" required autofocus>
        </div>
        <div>
          <label for="new-password">{{.T.PasswordNew}}</label>
          <input id="new-password" name="new_password" type="password"
                 autocomplete="new-password" required minlength="8">
        </div>
        <div>
          <label for="confirm-password">{{.T.PasswordConfirm}}</label>
          <input id="confirm-password" name="confirm_password" type="password"
                 autocomplete="new-password" required minlength="8">
        </div>
      </div>

      <p class="desc">{{.T.PasswordRule}}</p>

      <div class="row">
        <button type="submit" class="primary">{{.T.PasswordSubmit}}</button>
      </div>
      <p class="flash" id="password-result" hidden></p>
    </form>
  </section>
</main>
{{template "foot" .}}
