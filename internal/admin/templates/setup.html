{{template "head" .}}
<main class="centred">
  <div class="card login">
    <h1>{{.T.AppName}}</h1>

    <p class="muted">{{.T.SetupIntro}}</p>

    {{if .Error}}<p class="flash bad">{{.Error}}</p>{{end}}

    <form id="setup-form">
      <label for="username">{{.T.SetupUsername}}</label>
      <input type="text" id="username" name="username" autocomplete="username"
             autofocus required>

      <label for="password">{{.T.SetupPassword}}</label>
      <input type="password" id="password" name="password"
             autocomplete="new-password" required minlength="8">

      <label for="confirm">{{.T.SetupConfirm}}</label>
      <input type="password" id="confirm" name="confirm"
             autocomplete="new-password" required minlength="8">

      <button type="submit" class="primary">{{.T.SetupSubmit}}</button>
    </form>

    <p class="desc">{{.T.SetupPasswordRule}}</p>

    {{template "langs" .}}
  </div>
</main>
{{template "foot-plain" .}}
