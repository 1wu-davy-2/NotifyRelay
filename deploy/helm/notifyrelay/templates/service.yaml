apiVersion: v1
kind: Service
metadata:
  name: {{ include "notifyrelay.fullname" . }}
  labels:
    {{- include "notifyrelay.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.service.smtp.enabled }}
    - name: smtp
      port: {{ .Values.service.smtp.port }}
      targetPort: smtp
      protocol: TCP
    {{- end }}
  selector:
    {{- include "notifyrelay.selectorLabels" . | nindent 4 }}
