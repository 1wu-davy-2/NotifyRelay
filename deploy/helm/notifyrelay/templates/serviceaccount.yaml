{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "notifyrelay.serviceAccountName" . }}
  labels:
    {{- include "notifyrelay.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The relay talks to the outside world and to its own volume. It never calls
# the Kubernetes API, so it is given no token to do so with.
automountServiceAccountToken: false
{{- end }}
