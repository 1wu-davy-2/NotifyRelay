# docker compose up -d
#
# That is the whole deployment. The image carries a working configuration, the
# two long-lived keys are generated into the data volume on first boot, and
# everything else — the administrator account, the channels, the API keys — is
# created at http://localhost:18080/admin.
#
# To change any of it, mount your own configuration over the one in the image;
# see the commented volume below.

services:
  notifyrelay:
    build:
      context: .
      args:
        # Pinned so the image is amd64 regardless of the host toolchain.
        TARGETARCH: amd64
    image: notifyrelay:dev
    restart: unless-stopped

    ports:
      # Host port is configurable so a machine already using 18080 does not need
      # this file edited. Set NOTIFYRELAY_HTTP_PORT in .env, or here. Only the
      # host side moves: the service listens on 8080 inside the container, which
      # is what the image's configuration and the healthcheck below are written
      # against.
      - "${NOTIFYRELAY_HTTP_PORT:-18080}:8080" # HTTP API, the operator UI, /metrics
      - "${NOTIFYRELAY_SMTP_PORT:-2525}:2525" # SMTP inbound

    environment:
      # Nothing here is required. These are passed through from the host
      # environment or from .env, and *only* if set there — which matters for a
      # deployment that mounts its own configuration and writes `!env` in it.
      #
      # The list form is what makes that work. Writing
      # `SMTP_PASSWORD: ${SMTP_PASSWORD:-}` would define the variable as an
      # empty string even when nobody set it, and the configuration loader
      # treats "set but empty" as a real value — so a deployment that meant to
      # have no password would start with one.
      - NOTIFYRELAY_SECRET_KEY
      - NOTIFYRELAY_SESSION_KEY
      - SMTP_PASSWORD
      - WECOM_CORP_SECRET
      - DINGTALK_SECRET
      - FEISHU_SECRET
      - SLACK_TOKEN
      - WEBHOOK_SECRET

    volumes:
      # The database, the spooled message bodies, and the generated keys. This
      # is the volume that has to be backed up — it is a complete, restorable
      # backup, keys included.
      - notifyrelay-data:/app/data

      # To use your own configuration instead of the one in the image, create
      # the file first and then uncomment this. The `cp` matters: Docker creates
      # a *directory* at the mount point when the source does not exist, and the
      # service then fails to read it with a message about a directory.
      #
      #   cp configs/notifyrelay.example.yaml configs/notifyrelay.yaml
      #
      # - ./configs/notifyrelay.yaml:/etc/notifyrelay/config.yaml:ro

    # The image has no shell, so the healthcheck is the binary probing itself.
    # The Dockerfile declares one; this repeats it so a deployment that builds
    # the image elsewhere gets the same behaviour.
    healthcheck:
      test: ["CMD", "/notifyrelay", "--healthcheck", "127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    # Give the queue a chance to finish what it is holding. The service drains
    # in-flight deliveries on SIGTERM before it exits; killing it sooner leaves
    # those to the orphan sweep, which works but delivers later.
    stop_grace_period: 30s

volumes:
  notifyrelay-data:
